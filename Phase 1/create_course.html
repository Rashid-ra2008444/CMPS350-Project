<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creating & Validation Courses</title>
    <link rel="stylesheet" href="../Phase 1/css/Create_Course.css" />
    <script src="../Phase 1/js/Create_Course.js" defer></script>
  </head>

  <header>
    <h1>Welcome Admin</h1>
    <h2>Creating & Validation Courses</h2>
  </header>
  <!-- Navigation Course-->
  <nav>
    <input type="text" id="searchInput" placeholder="Course Name" />
    <select id="courseCategory">
      <option value="all">All Category</option>
      <option value="CMPS">Computer Science</option>
      <option value="CMPE">Computer Engineering</option>
      <option value="MATH">Mathmatics</option>
      <option value="GENG">General Engineering</option>
    </select>
  </nav>

  <body>
    <main>
      <div class="container">
        <!-- Here we will have an automatically creating boxes that includes the data of each course-->
        <!-- So for now we dont need to create the boxes manually 😄-->
        <div class="column">
          <h2>Pending</h2>
          <div id="pendingCourses"></div>
        </div>
        <div class="column">
          <h2>Valid Course</h2>
          <div id="validCourses"></div>
        </div>
        <div class="column">
          <h2>Invalid Course</h2>
          <div id="invalidCourses"></div>
        </div>
      </div>
      <button type="button" onclick="addCourse()">Add Course</button>
    </main>
  </body>

  <footer>
    &copyQatar University Group Project Collections of this magnificant Work
    2025. All rights reserved
  </footer>
</html>
