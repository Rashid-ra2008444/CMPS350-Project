<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/Registration.css" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="js/Registration.js"></script>
  </head>
  <body>
    <div class="sidebar">
      <h2 class="title">Qatar University</h2>
      <nav class="nav">
        <button class="Coursepage">Courses</button>
        <button class="plan">Study plan</button>
        <button class="logout">Logout</button>
      </nav>
      <div class="sidebar-footer">
        <img class="stev" src="/img/stevq.png" alt="stev" />
      </div>
    </div>
    <main>
      <section class="banner">
        <h1 class="title">Welcome <span id="student-name"></span></h1>
        <!-- <h2>Creating & Validation Courses</h2> -->
      </section>
      <div class="course-box">
        <div class="search-bar">
          <h2>Courses</h2>
          <input type="text" id="searchInput" placeholder="Course Name" />
          <select id="subjectSelect">
            <option value="All" selected>All</option>
            <option value="MATH">MATH</option>
            <option value="CMPS">CMPS</option>
            <option value="CMPE">CMPE</option>
            <option value="GENG">GENG</option>
          </select>
        </div>
        <!-- <div id="validCourses"></div> -->
      </div>
      <div class="course-box">
        <h2>Register a Course</h2>
        <div id="pendingCourses"></div>
      </div>
      <div class="walking-dog">
        <img
          src="https://th.bing.com/th/id/R.d3ced9489ad92112ec192b9b0a157abb?rik=xS4EjY43yu7E5Q&riu=http%3A%2F%2F24.media.tumblr.com%2F25ec1da1ceb3d8c59ff61abda466e66d%2Ftumblr_ms7532YHD61sfs2qco1_500.gif&ehk=HXsgue0NnAnJ%2FFqo9x0PQo1zFBZD6czkgM4kaC78jkU%3D&risl=&pid=ImgRaw&r=0"
        />
      </div>
      <footer class="banner">
        &copy; Qatar University Group Project Collections of this magnificant
        Work 2025. All rights reserved
      </footer>
    </main>
  </body>
</html>
